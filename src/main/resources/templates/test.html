<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Document</title>
</head>
<body>
    <h1>hello <span th:text="${name}"></span>님</h1>
    <p>당신의 나이는 <span th:text="${age}"></span>세 이군요.</p>
    <div>당신의 취미는</div>
    <ul>
        <li th:each="hobby : ${hobbies}">
            <span th:text="${hobby}"></span>
            <span th:if="${hobby == 'exercising'}">(대표 취미)</span>
        </li>
    </ul>
    <div>구나</div>
</body>
</html>
