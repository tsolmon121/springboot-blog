<!doctype html>
<html xmlns:prefix="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>My Blog</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-MKn5NWVBEuQXJE7TSKSgPUmMiSCmVTfCsR+VSSeQpHnoyJQZZFn/kBn+Ht5jZDPQ" crossorigin="anonymous">
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-+PW0IDVGGwmpaBQvcXY+W0BcpHpITFB3dSfSoGvDdHtLbrLpSbpGcvtQRM/BJpz+" crossorigin="anonymous"></script>
</head>
<body>
    <div class="p-5 mb-5 bg-light">
        <h1 class="mb-3">My blog</h1>
        <h4 class="mb-3">Welcome to my blog</h4>
    </div>
    <div class="container" >
        <div class="row-6" th:each="article : ${articles}">
            <div class="card">
                <div class="card-header" th:text="${article.id}"></div>
                <div class="card-body">
                    <div>
                        <h5 class="card-title" th:text="${article.title}"></h5>
                        <p class="card-text" th:text="${article.content}"></p>
                        <a class="btn btn-primary" href="#">보러가기</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
